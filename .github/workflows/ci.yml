name: Toolkit CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[windows,browser,dev]"
      - run: python -m ruff check engine fixtures tests twin.py
      - run: python -m pytest -q
      - run: python -m twin doctor
  postgres:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_USER: twin
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: app_twin_fixture_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U twin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TWIN_TEST_DATABASE_URL: postgresql+psycopg://twin:fixture@127.0.0.1:5432/app_twin_fixture_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install ".[dev]" -r engine/templates/backend/requirements.txt
      - run: python -m pytest -q
      - run: python -m twin generate --spec fixtures/example-uas.json --output state/generated
      - run: npm ci --ignore-scripts --prefix state/generated/frontend
      - run: npm run build --prefix state/generated/frontend
      - run: npm audit --audit-level=high --prefix state/generated/frontend
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r engine/templates/backend/requirements.txt
